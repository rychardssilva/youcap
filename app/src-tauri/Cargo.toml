[package]
name = "app"
version = "0.1.0"
description = "Aplicativo desktop para capturar, traduzir e salvar vocabulario de imersao."
authors = ["Immersion Vocabulary"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono", "uuid", "json"] }
tauri-plugin-global-shortcut = "2.3.2"
xcap = { version = "0.9.7", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls"] }
